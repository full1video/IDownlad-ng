<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Link Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        #timer {
            font-size: 3em;
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        #generatedLink {
            word-wrap: break-word;
            margin: 20px 0;
            display: none;
        }

        #copyBtn {
            margin-top: 10px;
            background: #008CBA;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Advanced Link Shortener 🔗</h1>
        
        <div class="input-group">
            <input type="url" id="adLink" placeholder="Enter Ad Link (Adsterra/Montage)">
            <input type="url" id="targetLink" placeholder="Enter Target Link">
        </div>

        <button onclick="generateShortLink()">Generate Short Link</button>
        
        <div id="generatedLink"></div>
        <button id="copyBtn" onclick="copyLink()">Copy Link</button>

        <div id="timer">01:00</div>
    </div>

    <script>
        async function generateShortLink() {
            const adLink = document.getElementById('adLink').value;
            const targetLink = document.getElementById('targetLink').value;
            
            // Generate random short code
            const shortCode = Math.random().toString(36).substr(2, 8);
            const shortUrl = `${window.location.href}${shortCode}`;

            // Save to localStorage
            localStorage.setItem(shortCode, JSON.stringify({
                adLink,
                targetLink
            }));

            // Show generated link
            document.getElementById('generatedLink').innerHTML = `Short Link: ${shortUrl}`;
            document.getElementById('generatedLink').style.display = 'block';
            document.getElementById('copyBtn').style.display = 'block';

            // Send visitor data to Telegram
            const visitorData = await getVisitorData();
            sendToTelegram({...visitorData, shortUrl, targetLink});
        }

        function copyLink() {
            const text = document.getElementById('generatedLink').innerText.split(': ')[1];
            navigator.clipboard.writeText(text);
            alert('Link copied to clipboard!');
        }

        async function getVisitorData() {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            return {
                ip: data.ip,
                city: data.city,
                region: data.region,
                country: data.country_name,
                device: navigator.userAgent,
                platform: navigator.platform
            };
        }

        function sendToTelegram(data) {
            const botToken = '7487768405:AAHivvY7f_SjAw13ZgYQeUYwgCQ-2FkTKjs';
            const chatId = '7749024395';
            const text = `📢 New Link Created!\n\n🔗 Short Link: ${data.shortUrl}\n🎯 Target: ${data.targetLink}\n\n🌐 IP: ${data.ip}\n📍 Location: ${data.city}, ${data.region}, ${data.country}\n🖥️ Device: ${data.platform}\n📱 User Agent: ${data.device}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: text
                })
            });
        }

        // Redirect Logic
        const path = window.location.pathname.substring(1);
        if(path) {
            const data = JSON.parse(localStorage.getItem(path));
            if(data) {
                document.querySelector('.container').style.display = 'none';
                document.getElementById('timer').style.display = 'block';

                let timeLeft = 60;
                const timer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').textContent = 
                        `${String(Math.floor(timeLeft/60)).padStart(2, '0')}:${String(timeLeft%60).padStart(2, '0')}`;
                    
                    if(timeLeft <= 0) {
                        clearInterval(timer);
                        window.location.href = data.targetLink;
                    }
                }, 1000);

                // Open ad link in new tab
                window.open(data.adLink, '_blank');
            }
        }
    </script>
</body>
</html>
